
{% extends 'myapp/base.html' %}

{% block title %}Create Project{% endblock %}

{% block content %}
<h1>Create a new project</h1>

<form method="POST">
    {% csrf_token %}

    <label>Título del proyecto:</label>
    {{ form.title }}

    <label>Descripción del proyecto:</label>
    {{ form.description }}

    <button type="submit">Save</button>
</form>

{% endblock %}
