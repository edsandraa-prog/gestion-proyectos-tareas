
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Gestión de proyectos{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #263238;
        }

        nav {
            background: #263238;
            padding: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            color: #80cbc4;
        }

        main {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 12px 0;
            border-radius: 10px;
        }

        input, textarea, select {
            box-sizing: border-box;
        }

        table {
            background: white;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'hello' %}">Home</a>
        <a href="{% url 'hello' %}">About</a>
        <a href="{% url 'projects' %}">Projects</a>
        <a href="{% url 'tasks' %}">Tasks</a>
        <a href="{% url 'create_task' %}">Create task</a>
        <a href="{% url 'create_project' %}">Create Project</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
