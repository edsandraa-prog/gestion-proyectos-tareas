
{% extends 'myapp/base.html' %}

{% block title %}Projects{% endblock %}

{% block content %}
<h1>Projects</h1>

{% for project in projects %}
<div class="card">
    <h2>
    <a href="{% url 'project_detail' project.id %}">
        {{ project.title }}
    </a>
</h2>
    <p>{{ project.description }}</p>
</div>
{% empty %}
<p>No hay proyectos registrados todavía.</p>
{% endfor %}

{% endblock %}
