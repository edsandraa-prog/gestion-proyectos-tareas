
{% extends 'myapp/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar tarea</h2>

    <p>¿Estás segura de que deseas eliminar esta tarea?</p>

    <h4>{{ task.title }}</h4>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'tasks' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
